name: Test Caducus
description: The one definition of how Caducus is tested. CI and Release both use it.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      shell: bash
      run: pip install -e ".[dev,radar,reinforcement-memory,notify-dev]"
    - name: Workaround virtuus VERSION bug
      shell: bash
      run: |
        SITE_PKG=$(python -c "import site; print(site.getsitepackages()[0])")
        VERSION_PATH=$(dirname $(dirname $SITE_PKG))/VERSION
        echo "0.4.3" | sudo tee $VERSION_PATH > /dev/null
    - name: Run Pytest
      shell: bash
      run: pytest
    - name: Run Behave
      shell: bash
      run: behave
