[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caducus"
version = "0.1.4"
description = "CLI for collecting ops events and running reinforcement-memory analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
  "virtuus>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "behave>=1.2.6",
  "pytest>=8.0",
  "ruff>=0.4.0",
  "black>=24.0",
  "build>=1.2.2",
  "python-semantic-release>=10.5.3",
]
# The notification service. The CLI does not need these.
notify = [
  "boto3>=1.34",
]
notify-dev = [
  "boto3>=1.34",
  "moto[dynamodb,sqs,ssm,ses]>=5.0",
  "jsonschema>=4.0",
  "aws-cdk-lib>=2.140,<3",
  "constructs>=10,<11",
  "pytest-cov>=5.0",
]
reinforcement-memory = [
  "biblicus>=1.6.0",
  "scikit-learn>=1.3.0",
]

[project.scripts]
caducus = "caducus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m pip install build && python -m build"
commit_parser = "conventional"
version_toml = [
  "pyproject.toml:project.version",
]
version_variables = [
  "src/caducus/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
