[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caducus"
version = "0.1.4"
description = "CLI for collecting ops events and running reinforcement-memory analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "behave>=1.2.6",
  "pytest>=8.0",
  "ruff>=0.4.0",
  "black>=24.0",
  "build>=1.2.2",
  "python-semantic-release>=10.5.3",
]
# The log radar and its CLI.
radar = [
  "PyYAML>=6.0",
  "virtuus>=0.4.0",
]
# Notifications, run inside a host's own deployment. boto3 is already in the Lambda runtime.
notify = [
  "boto3>=1.35.8",  # SES v2 Simple.Headers, for RFC 8058 one-click unsubscribe
  "dnspython>=2.6",  # the public audience's check that a domain takes mail
]
notify-dev = [
  "boto3>=1.35.8",
  "dnspython>=2.6",
  "moto[dynamodb,sqs,ssm,ses]>=5.0",
  "jsonschema>=4.0",
  "PyYAML>=6.0",
  "pytest-cov>=5.0",
]
reinforcement-memory = [
  "biblicus>=1.6.0",
  "scikit-learn>=1.3.0",
]

[project.scripts]
caducus = "caducus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"caducus.notify" = ["data/*.json", "schemas/*.json"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m pip install build && python -m build"
commit_parser = "conventional"
version_toml = [
  "pyproject.toml:project.version",
]
version_variables = [
  "src/caducus/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
