# The registry of notification kinds. Apps name a kind; this file says who hears
# about it and how. A kind the registry does not know is refused and recorded.
#
#   class      operator | admin | account | public
#   defaultOn  whether a person receives it until they choose otherwise
#   channels   where it may go
#   ack        none | requested (a person is asked, overtly, to acknowledge)
#   grouping   null, or: by (event fields that make one group) and
#              windowSeconds (alarms firing together inside it become one message)
#   lifecycle  null, or "incident": the kind carries ALARM/OK transitions and is
#              tracked as one incident with one message to open and one to clear
kinds:
  cloudwatch.alarm:
    class: operator
    defaultOn: true
    channels: [email]
    ack: none
    lifecycle: incident
    grouping:
      by: [product, site]
      windowSeconds: 120
