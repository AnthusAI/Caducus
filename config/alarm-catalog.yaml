# Triage notes for CloudWatch alarms: names and advice only, nothing private.
# Account ids, the sign-in portal and the permission set live in SSM, never here.
#
# pattern   regular expression matched against the whole alarm name; a named
#           group (?P<site>...) says how to read the site from the name
# what      what broke, in a sentence
# impact    who or what is affected
# next      the next step, specific enough to start without logging in first
# holdDownSeconds  optional per alarm; how long an alarm must stay OK before
#           the incident is called cleared (adjust from observed flapping)
defaults:
  holdDownSeconds: 300

alarms:
  # Seeded from Papyrus infra/monitoring/papyrus-monitoring.yaml
  - pattern: '^papyrus-monitoring-collector-errors$'
    product: papyrus
    what: A monitor's collector Lambda reported an error (a failed fetch or a crash).
    impact: New items from the affected monitors stop arriving until a run succeeds.
    next: Read the collector's log group. If the failing log line names a monitor (monitorId), read that monitor's latest run receipt first.
  - pattern: '^papyrus-monitoring-search-provider-failing$'
    product: papyrus
    what: A web-search provider refused the collector's key or reported its plan used up.
    impact: Monitors that search through that provider find nothing new until it answers again.
    next: Read the search_provider_failing log lines for the provider, kind and monitor, then renew the key or top up the plan on that provider's account.
  - pattern: '^papyrus-monitoring-router-errors$'
    product: papyrus
    what: The router Lambda reported an error (a crash or a timeout).
    impact: Items wait unrouted, so they do not reach Cyclotron decisions or the newsroom.
    next: Read the latest ROUTERUN receipt and the router's log group.
  - pattern: '^papyrus-monitoring-router-dead-letters$'
    product: papyrus
    what: A router invocation failed after delivery and was dead-lettered.
    impact: Those items are parked in the dead-letter queue and are not being routed.
    next: Inspect the router dead-letter queue, fix the cause, then redrive it.
  - pattern: '^papyrus-monitoring-decisions-stopped$'
    product: papyrus
    what: Cyclotron decisions stopped while items are waiting for them.
    impact: Items wait for a decision, so nothing new is chosen for the newsroom.
    next: Check the Cyclotron run status and hand it to the Cyclotron session (docs/monitoring-cloud.md in Papyrus).
  # Seeded from the scheduled-container-job stack. CDK generates these names, so they are matched by their construct ids.
  - pattern: '.*FailureAlarm.*'
    product: papyrus
    what: A scheduled job execution failed, timed out or was aborted.
    impact: That job's output for the period is missing.
    next: Open the job's Step Functions state machine, read the failed execution and its task logs, then rerun the job.
  - pattern: '.*MissedWeekAlarm.*'
    product: papyrus
    what: A scheduled job has had no successful execution for eight days.
    impact: That job's weekly output is overdue.
    next: Open the job's Step Functions state machine and read the last executions; start a run once the cause is fixed.
  # Seeded from the newsletter plugin's two rate alarms
  - pattern: '^papyrus-newsletter-(?P<site>.+)-bounce-rate$'
    product: papyrus
    what: The newsletter bounce rate is above its limit over 24 hours.
    impact: Newsletter sending for this site is paused automatically to protect the sending reputation.
    next: Read the site's newsletter event log for the addresses that bounced, remove bad addresses, then resume sending.
  - pattern: '^papyrus-newsletter-(?P<site>.+)-complaint-rate$'
    product: papyrus
    what: The newsletter complaint rate is above its limit over 24 hours.
    impact: Newsletter sending for this site is paused automatically to protect the sending reputation.
    next: Read the site's newsletter event log for who complained and check what was sent, then resume sending.
