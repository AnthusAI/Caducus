AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GitHub OIDC deploy role for the Caducus notification service. Deployed once, by hand, from
  Ryan's session in the caducus-production account. After that every merge to main deploys with
  no stored key. The role can be assumed only by a workflow running on main of this repository,
  and it can do nothing except assume the CDK bootstrap roles.

Parameters:
  GitHubRepository:
    Type: String
    Default: AnthusAI/Caducus
    Description: Owner/repository allowed to deploy.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Use "false" if this account already has the GitHub OIDC provider.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: The provider's ARN when CreateOidcProvider is "false".

Conditions:
  MakeProvider:
    Fn::Equals: [{ Ref: CreateOidcProvider }, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: caducus-github-deploy
      Description: Assumed by GitHub Actions on main to run cdk deploy for the notification service
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated:
                Fn::If:
                  - MakeProvider
                  - { Ref: GitHubProvider }
                  - { Ref: ExistingOidcProviderArn }
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: "repo:${GitHubRepository}:ref:refs/heads/main"
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/cdk-*"

Outputs:
  DeployRoleName:
    Value: { Ref: DeployRole }
